name: Test Machine Configuration Packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── Linux: full lifecycle (compile → package → audit → remediate → verify) ───
  test-linux:
    name: "Linux — Full Lifecycle"
    runs-on: ubuntu-latest
    container:
      image: petariv/azure-machine-config-linux:latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile all Linux examples
        shell: pwsh
        run: |
          foreach ($ex in @('examples/LinuxFileConfig.ps1','examples/LinuxSecurityBaseline.ps1','examples/LinuxServiceMonitor.ps1')) {
            Write-Host "Compiling $ex..." -ForegroundColor Cyan
            . $ex
            $name = [System.IO.Path]::GetFileNameWithoutExtension($ex)
            if (-not (Test-Path "./$name/localhost.mof")) { Write-Error "✗ $name"; exit 1 }
            Write-Host "  ✓ $name" -ForegroundColor Green
          }

      - name: Package LinuxFileConfig
        id: package
        shell: pwsh
        run: |
          Rename-Item './LinuxFileConfig/localhost.mof' 'LinuxFileConfig.mof' -Force
          $pkg = New-GuestConfigurationPackage -Name LinuxFileConfig `
            -Configuration './LinuxFileConfig/LinuxFileConfig.mof' `
            -Path './output' -Type AuditAndSet -Force
          "PACKAGE_PATH=$($pkg.Path)" >> $env:GITHUB_OUTPUT
          if (-not (Test-Path $pkg.Path)) { exit 1 }
          Write-Host "✓ Package: $([math]::Round((Get-Item $pkg.Path).Length / 1KB, 1)) KB"

      - name: Audit (expect non-compliant)
        shell: pwsh
        run: |
          $r = Get-GuestConfigurationPackageComplianceStatus -Path '${{ steps.package.outputs.PACKAGE_PATH }}'
          Write-Host "Compliance: $($r.complianceStatus)"
          if ($r.complianceStatus -eq $true) { Write-Error "Expected non-compliant"; exit 1 }
          Write-Host "✓ Correctly non-compliant" -ForegroundColor Green

      - name: Remediate
        shell: pwsh
        run: |
          Start-GuestConfigurationPackageRemediation -Path '${{ steps.package.outputs.PACKAGE_PATH }}'
          Write-Host "✓ Remediation applied" -ForegroundColor Green

      - name: Audit (expect compliant)
        shell: pwsh
        run: |
          $r = Get-GuestConfigurationPackageComplianceStatus -Path '${{ steps.package.outputs.PACKAGE_PATH }}'
          Write-Host "Compliance: $($r.complianceStatus)"
          if ($r.complianceStatus -ne $true) { Write-Error "Expected compliant"; exit 1 }
          Write-Host "✓ Compliant after remediation" -ForegroundColor Green

      - name: Upload packages
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-packages
          path: output/
          retention-days: 7

  # ─── Windows: compile + package (no LCM on runners for audit/remediate) ───
  test-windows:
    name: "Windows — Compile & Package"
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PSDscResources (WinPS 5.1)
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSDscResources -Force -Scope CurrentUser

      - name: Install GuestConfiguration + PSDscResources (pwsh 7)
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name GuestConfiguration -Force -Scope CurrentUser
          Install-Module -Name PSDscResources -Force -Scope CurrentUser
          Write-Host "✓ Modules installed" -ForegroundColor Green

      - name: Compile all Windows examples (WinPS 5.1)
        shell: powershell
        run: |
          foreach ($ex in @(
            'windows-examples\WindowsSecurityBaseline.ps1',
            'windows-examples\WindowsServerHardening.ps1',
            'windows-examples\WindowsFileCompliance.ps1'
          )) {
            Write-Host "Compiling $ex..." -ForegroundColor Cyan
            . $ex
            $name = [System.IO.Path]::GetFileNameWithoutExtension($ex)
            if (-not (Test-Path ".\$name\localhost.mof")) { Write-Error "FAIL: $name"; exit 1 }
            Write-Host "  OK: $name" -ForegroundColor Green
          }

      - name: Fix MOF module references
        shell: pwsh
        run: |
          # GuestConfiguration requires PSDscResources — fix any built-in module refs in MOFs
          foreach ($dir in @('WindowsSecurityBaseline','WindowsServerHardening','WindowsFileCompliance')) {
            $mof = "./$dir/localhost.mof"
            if (Test-Path $mof) {
              (Get-Content $mof -Raw) -replace 'ModuleName = "PSDesiredStateConfiguration"','ModuleName = "PSDscResources"' |
                Set-Content $mof -NoNewline
              Write-Host "✓ Fixed $mof"
            }
          }

      - name: Package all Windows configs
        shell: pwsh
        run: |
          foreach ($name in @('WindowsSecurityBaseline','WindowsServerHardening','WindowsFileCompliance')) {
            Write-Host "Packaging $name..." -ForegroundColor Cyan
            Rename-Item "./$name/localhost.mof" "$name.mof" -Force
            $pkg = New-GuestConfigurationPackage -Name $name `
              -Configuration "./$name/$name.mof" `
              -Path './output' -Type AuditAndSet -Force
            if (-not (Test-Path $pkg.Path)) { Write-Error "✗ $name"; exit 1 }
            $size = [math]::Round((Get-Item $pkg.Path).Length / 1KB, 1)
            Write-Host "  ✓ $name ($size KB)" -ForegroundColor Green
          }
          Write-Host ""
          Write-Host "Note: Audit/remediate requires DSC LCM (not available on GitHub runners)."
          Write-Host "Full lifecycle testing runs on the Linux job and on actual Azure VMs."

      - name: Upload packages
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-packages
          path: output/
          retention-days: 7
