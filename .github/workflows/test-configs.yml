name: Test Machine Configuration Packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-linux:
    name: "Linux (Ubuntu 22.04)"
    runs-on: ubuntu-latest
    container:
      image: petariv/azure-machine-config-linux:latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile all Linux examples
        shell: pwsh
        run: |
          foreach ($ex in @('examples/LinuxFileConfig.ps1','examples/LinuxSecurityBaseline.ps1','examples/LinuxServiceMonitor.ps1')) {
            Write-Host "Compiling $ex..." -ForegroundColor Cyan
            . $ex
            $name = [System.IO.Path]::GetFileNameWithoutExtension($ex)
            if (-not (Test-Path "./$name/localhost.mof")) { Write-Error "✗ $name"; exit 1 }
            Write-Host "  ✓ $name" -ForegroundColor Green
          }

      - name: Package LinuxFileConfig
        id: package
        shell: pwsh
        run: |
          Rename-Item './LinuxFileConfig/localhost.mof' 'LinuxFileConfig.mof' -Force
          $pkg = New-GuestConfigurationPackage -Name LinuxFileConfig -Configuration './LinuxFileConfig/LinuxFileConfig.mof' -Path './output' -Type AuditAndSet -Force
          "PACKAGE_PATH=$($pkg.Path)" >> $env:GITHUB_OUTPUT
          if (-not (Test-Path $pkg.Path)) { exit 1 }
          Write-Host "✓ Package: $([math]::Round((Get-Item $pkg.Path).Length / 1KB, 1)) KB" -ForegroundColor Green

      - name: Audit → Remediate → Audit
        shell: pwsh
        run: |
          $path = '${{ steps.package.outputs.PACKAGE_PATH }}'
          $before = Get-GuestConfigurationPackageComplianceStatus -Path $path
          Write-Host "Before: $($before.complianceStatus)"
          if ($before.complianceStatus -eq $true) { Write-Error "Should be non-compliant"; exit 1 }
          Start-GuestConfigurationPackageRemediation -Path $path
          $after = Get-GuestConfigurationPackageComplianceStatus -Path $path
          Write-Host "After:  $($after.complianceStatus)"
          if ($after.complianceStatus -ne $true) { Write-Error "Should be compliant"; exit 1 }
          Write-Host "✓ Full lifecycle passed" -ForegroundColor Green

      - name: Upload packages
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-packages
          path: output/
          retention-days: 7

  test-windows:
    name: "Windows (Server 2022)"
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install modules
        shell: powershell
        run: |
          # Install PSDscResources in Windows PowerShell 5.1 for compilation
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSDscResources -Force -Scope CurrentUser
          Write-Host "WinPS modules installed" -ForegroundColor Green

      - name: Install GuestConfiguration (pwsh 7)
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name GuestConfiguration -Force -Scope CurrentUser
          Install-Module -Name PSDscResources -Force -Scope CurrentUser
          Write-Host "✓ pwsh modules installed" -ForegroundColor Green

      - name: Compile Windows examples (WinPS 5.1)
        shell: powershell
        run: |
          foreach ($ex in @('windows-examples\WindowsSecurityBaseline.ps1','windows-examples\WindowsServerHardening.ps1','windows-examples\WindowsFileCompliance.ps1')) {
            Write-Host "Compiling $ex..." -ForegroundColor Cyan
            . $ex
            $name = [System.IO.Path]::GetFileNameWithoutExtension($ex)
            if (-not (Test-Path ".\$name\localhost.mof")) { Write-Error "FAIL: $name"; exit 1 }
            Write-Host "  OK: $name" -ForegroundColor Green
          }

      - name: Package WindowsFileCompliance
        id: package
        shell: pwsh
        run: |
          Rename-Item './WindowsFileCompliance/localhost.mof' 'WindowsFileCompliance.mof' -Force
          $pkg = New-GuestConfigurationPackage -Name WindowsFileCompliance -Configuration './WindowsFileCompliance/WindowsFileCompliance.mof' -Path './output' -Type AuditAndSet -Force
          "PACKAGE_PATH=$($pkg.Path)" >> $env:GITHUB_OUTPUT
          if (-not (Test-Path $pkg.Path)) { exit 1 }
          Write-Host "✓ Package: $([math]::Round((Get-Item $pkg.Path).Length / 1KB, 1)) KB" -ForegroundColor Green

      - name: Audit → Remediate → Audit
        shell: pwsh
        run: |
          $path = '${{ steps.package.outputs.PACKAGE_PATH }}'
          $before = Get-GuestConfigurationPackageComplianceStatus -Path $path
          Write-Host "Before: $($before.complianceStatus)"
          if ($before.complianceStatus -eq $true) { Write-Error "Should be non-compliant"; exit 1 }
          Start-GuestConfigurationPackageRemediation -Path $path
          $after = Get-GuestConfigurationPackageComplianceStatus -Path $path
          Write-Host "After:  $($after.complianceStatus)"
          if ($after.complianceStatus -ne $true) { Write-Error "Should be compliant"; exit 1 }
          Write-Host "✓ Full lifecycle passed" -ForegroundColor Green

      - name: Upload packages
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-packages
          path: output/
          retention-days: 7
