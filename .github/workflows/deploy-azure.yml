name: "Deploy to Azure (Optional)"

on:
  workflow_dispatch:
    inputs:
      config_name:
        description: 'Configuration name'
        required: true
        default: 'LinuxFileConfig'
        type: choice
        options:
          - LinuxFileConfig
          - LinuxSecurityBaseline
          - LinuxServiceMonitor
      policy_mode:
        description: 'Policy mode'
        required: true
        default: 'Audit'
        type: choice
        options:
          - Audit
          - AuditAndSet
      resource_group:
        description: 'Target Resource Group'
        required: true
      assignment_name:
        description: 'Policy assignment display name'
        required: false

env:
  STORAGE_ACCOUNT: mcpackages
  CONTAINER_NAME: guestconfiguration

jobs:
  deploy:
    name: "Publish & Assign Policy"
    runs-on: ubuntu-latest
    container:
      image: petariv/azure-machine-config-linux:latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile configuration
        shell: pwsh
        run: |
          . "examples/${{ inputs.config_name }}.ps1"
          Rename-Item './${{ inputs.config_name }}/localhost.mof' '${{ inputs.config_name }}.mof' -Force

      - name: Build package
        shell: pwsh
        run: |
          $pkg = New-GuestConfigurationPackage -Name '${{ inputs.config_name }}' `
            -Configuration './${{ inputs.config_name }}/${{ inputs.config_name }}.mof' `
            -Path './output' -Type '${{ inputs.policy_mode }}' -Force

      - name: Login to Azure
        shell: pwsh
        run: |
          $creds = '${{ secrets.AZURE_CREDENTIALS }}' | ConvertFrom-Json
          $securePassword = ConvertTo-SecureString $creds.clientSecret -AsPlainText -Force
          $psCred = New-Object System.Management.Automation.PSCredential($creds.clientId, $securePassword)
          Connect-AzAccount -ServicePrincipal -Credential $psCred -Tenant $creds.tenantId
          Set-AzContext -Subscription $creds.subscriptionId

      - name: Publish and assign policy
        shell: pwsh
        run: |
          $displayName = if ('${{ inputs.assignment_name }}') { '${{ inputs.assignment_name }}' }
                         else { 'MC: ${{ inputs.config_name }} (${{ inputs.policy_mode }})' }

          $storageAccount = Get-AzStorageAccount | Where-Object StorageAccountName -eq '${{ env.STORAGE_ACCOUNT }}'
          $ctx = $storageAccount.Context
          New-AzStorageContainer -Name '${{ env.CONTAINER_NAME }}' -Context $ctx -ErrorAction SilentlyContinue

          Set-AzStorageBlobContent -File './output/${{ inputs.config_name }}/${{ inputs.config_name }}.zip' `
            -Container '${{ env.CONTAINER_NAME }}' -Blob '${{ inputs.config_name }}.zip' -Context $ctx -Force

          $sasUri = New-AzStorageBlobSASToken -Container '${{ env.CONTAINER_NAME }}' `
            -Blob '${{ inputs.config_name }}.zip' -Context $ctx -Permission r `
            -ExpiryTime (Get-Date).AddYears(3) -FullUri

          $policyDef = New-GuestConfigurationPolicy -PolicyId (New-Guid).Guid `
            -ContentUri $sasUri -DisplayName $displayName `
            -Description "Machine Configuration: ${{ inputs.config_name }}" `
            -Platform Linux -Mode '${{ inputs.policy_mode }}' `
            -Path './policies' -Version '1.0.0'

          $published = Publish-GuestConfigurationPolicy -Path './policies'
          $rg = Get-AzResourceGroup -Name '${{ inputs.resource_group }}'
          New-AzPolicyAssignment -Name "${{ inputs.config_name }}-assignment" `
            -DisplayName $displayName `
            -PolicyDefinition (Get-AzPolicyDefinition -Name $published.Name) `
            -Scope $rg.ResourceId

          Write-Host "✓ Policy published and assigned to ${{ inputs.resource_group }}" -ForegroundColor Green
